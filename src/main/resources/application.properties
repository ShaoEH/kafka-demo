spring.application.name=kafka-demo
server.port=8090

# 公共配置
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.properties.schema.registry.url=http://localhost:8081

# =====================================================================
# Producer 配置
# =====================================================================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.transaction-id-prefix=tx-
spring.kafka.producer.properties.transaction.timeout.ms=60000
spring.kafka.producer.properties.schema.registry.url=http://localhost:8081

# =====================================================================
# Consumer 配置
# =====================================================================
spring.kafka.consumer.group-id=orders-group-1
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.isolation-level=read_committed

# 1. Key 保持不變，直接用 String 解碼
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# 2. 【修改這裡】外層換成 Spring 的防崩潰安全外殼
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# 3. 【加入這裡】內層指定真正的 Confluent Avro 反序列化器 (注意底下的前綴是 spring.deserializer)
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=io.confluent.kafka.serializers.KafkaAvroDeserializer

# 4. 核心 Avro 特性與信任設定
spring.kafka.consumer.properties.schema.registry.url=http://localhost:8081
spring.kafka.consumer.properties.specific.avro.reader=true
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.avro.remove.java.properties=true